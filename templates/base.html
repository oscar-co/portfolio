<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}Oscar Carrero's QA automation and software development portfolio.{% endblock %}">
  <title>{% block title %}Oscar Carrero — Senior QA Automation Engineer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/refinements.css') }}">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

    <a class="brand" href="#top" aria-label="Back to top">
      <span class="brand-mark">OC</span><span class="brand-dot">.</span>
    </a>

      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#stack">Stack</a>
      <a href="#projects">Projects</a>
      <a class="nav-cta" href="{{ url_for('static', filename='cv/cv_ocarrero_eng.pdf') }}" download>Download CV <span>↓</span></a>
