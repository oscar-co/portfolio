services:
  portfolio:
    build:
      context: .
      target: runtime
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
